model_list:
  # Classifier models (fast/cheap → small model)
  # Map to your local Ollama \"qwen3:8b\" model
  - model_name: openai/gpt-4.1-mini
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://localhost:11434

  - model_name: openai/gpt-4o-mini
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://localhost:11434

  # Reasoning models (slower/more capable) → use a larger local model.
  # Also mapped to qwen3:8b for local dev. Swap to a larger model when hardware allows.
  - model_name: openai/gpt-4.1
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://localhost:11434

  - model_name: openai/gpt-4o
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://localhost:11434

litellm_settings:
  drop_params: true       # Ollama ignores unknown OpenAI params (e.g. logprobs)
  request_timeout: 300    # Local models can be slow; increase if needed

general_settings:
  master_key: "sk-local-dev"   # Required by litellm proxy, value doesn't matter locally
