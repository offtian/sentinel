<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" font-family="'Virgil','Comic Sans MS','Segoe UI',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="1"/>
      <feDisplacementMap in="SourceGraphic" scale="1.2"/>
    </filter>
    <style>
      .title { font-size: 24px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-size: 13px; font-style: italic; fill: #555; }
      .lane { font-size: 14px; font-weight: 700; fill: #222; }
      .box { stroke: #222; stroke-width: 2; fill: #fff; }
      .box-sre { fill: #e8f4ff; stroke: #1f6feb; }
      .box-devops { fill: #fff4e8; stroke: #d97706; }
      .box-ace { fill: #efe8ff; stroke: #7c3aed; }
      .box-pipeline { fill: #f0fdf4; stroke: #15803d; }
      .box-platform { fill: #fef3c7; stroke: #92400e; }
      .box-spoke { fill: #fee2e2; stroke: #b91c1c; }
      .box-data { fill: #fdf2f8; stroke: #be185d; }
      .label { font-size: 12px; fill: #1a1a1a; }
      .label-small { font-size: 11px; fill: #444; }
      .label-tiny { font-size: 10px; fill: #666; }
      .arrow { stroke: #222; stroke-width: 1.6; fill: none; }
      .arrow-dim { stroke: #888; stroke-width: 1.4; fill: none; stroke-dasharray: 6 3; }
      .arrow-thick { stroke: #15803d; stroke-width: 2.4; fill: none; }
      .lane-bg { fill: #fafafa; stroke: #ddd; stroke-width: 1; }
      .barrier { fill: none; stroke: #b91c1c; stroke-width: 2; stroke-dasharray: 8 4; }
    </style>
  </defs>

  <!-- Title -->
  <text x="700" y="32" text-anchor="middle" class="title">Sentinel — high-level architecture</text>
  <text x="700" y="52" text-anchor="middle" class="subtitle">three platform-engineering team profiles · shared agent harness · firm-existing infra · per-PM information barriers</text>

  <!-- ============== Lane 1: Alert sources ============== -->
  <rect x="40" y="78" width="1320" height="80" class="lane-bg" rx="4"/>
  <text x="60" y="100" class="lane">1. Alert sources</text>

  <rect x="160" y="110" width="160" height="38" class="box" rx="6"/>
  <text x="240" y="134" text-anchor="middle" class="label">AlertManager (Prometheus)</text>

  <rect x="340" y="110" width="120" height="38" class="box" rx="6"/>
  <text x="400" y="134" text-anchor="middle" class="label">Datadog monitors</text>

  <rect x="480" y="110" width="120" height="38" class="box" rx="6"/>
  <text x="540" y="134" text-anchor="middle" class="label">PagerDuty</text>

  <rect x="620" y="110" width="120" height="38" class="box" rx="6"/>
  <text x="680" y="134" text-anchor="middle" class="label">Jenkins / Harness</text>

  <rect x="760" y="110" width="160" height="38" class="box" rx="6"/>
  <text x="840" y="134" text-anchor="middle" class="label">Linux/VM monitors (ACE)</text>

  <!-- ============== Lane 2: Three team profiles ============== -->
  <rect x="40" y="178" width="1320" height="100" class="lane-bg" rx="4"/>
  <text x="60" y="200" class="lane">2. Team-profile routing</text>

  <rect x="160" y="218" width="220" height="50" class="box box-sre" rx="6"/>
  <text x="270" y="240" text-anchor="middle" class="label" style="font-weight:700">SRE profile</text>
  <text x="270" y="258" text-anchor="middle" class="label-small">Grafana · Prom/Loki · K8s</text>

  <rect x="420" y="218" width="220" height="50" class="box box-devops" rx="6"/>
  <text x="530" y="240" text-anchor="middle" class="label" style="font-weight:700">DevOps profile</text>
  <text x="530" y="258" text-anchor="middle" class="label-small">Jenkins · Harness · K8s</text>

  <rect x="680" y="218" width="220" height="50" class="box box-ace" rx="6"/>
  <text x="790" y="240" text-anchor="middle" class="label" style="font-weight:700">ACE profile</text>
  <text x="790" y="258" text-anchor="middle" class="label-small">Linux · VM · PM-self-serve</text>

  <text x="1100" y="246" class="label-small">→ each profile owns its own</text>
  <text x="1100" y="262" class="label-small">runbooks, tools, prompts, channels</text>

  <!-- arrows from sources to profiles -->
  <path class="arrow" d="M 240 148 L 240 178" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 400 148 L 400 178" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 540 148 L 540 178" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 680 148 L 680 178" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 840 148 L 840 178" marker-end="url(#arrow)"/>

  <!-- ============== Lane 3: Pipeline ============== -->
  <rect x="40" y="298" width="1320" height="180" class="lane-bg" rx="4"/>
  <text x="60" y="320" class="lane">3. Investigation pipeline (per request_id = OTEL trace_id, UUIDv7)</text>

  <!-- 6 stages -->
  <g>
    <rect x="80" y="338" width="160" height="100" class="box box-pipeline" rx="6"/>
    <text x="160" y="358" text-anchor="middle" class="label" style="font-weight:700">1. Ingress</text>
    <text x="160" y="378" text-anchor="middle" class="label-tiny">dedup 60s window</text>
    <text x="160" y="394" text-anchor="middle" class="label-tiny">mint request_id (UUIDv7)</text>
    <text x="160" y="410" text-anchor="middle" class="label-tiny">redact annotations</text>
    <text x="160" y="426" text-anchor="middle" class="label-tiny">→ alert_request</text>
  </g>

  <g>
    <rect x="260" y="338" width="160" height="100" class="box box-pipeline" rx="6"/>
    <text x="340" y="358" text-anchor="middle" class="label" style="font-weight:700">2. Runbook match</text>
    <text x="340" y="378" text-anchor="middle" class="label-tiny">tag-selector primary</text>
    <text x="340" y="394" text-anchor="middle" class="label-tiny">RAG fallback</text>
    <text x="340" y="410" text-anchor="middle" class="label-tiny">generic playbook</text>
    <text x="340" y="426" text-anchor="middle" class="label-tiny">→ runbook_match</text>
  </g>

  <g>
    <rect x="440" y="338" width="160" height="100" class="box box-pipeline" rx="6"/>
    <text x="520" y="358" text-anchor="middle" class="label" style="font-weight:700">2.5 Case history</text>
    <text x="520" y="378" text-anchor="middle" class="label-tiny">pgvector + BM25</text>
    <text x="520" y="394" text-anchor="middle" class="label-tiny">tenant-only retrieval</text>
    <text x="520" y="410" text-anchor="middle" class="label-tiny">2-pass redactor</text>
    <text x="520" y="426" text-anchor="middle" class="label-tiny">→ case_history rows</text>
  </g>

  <g>
    <rect x="620" y="338" width="160" height="100" class="box box-pipeline" rx="6"/>
    <text x="700" y="358" text-anchor="middle" class="label" style="font-weight:700">3. Enrichment</text>
    <text x="700" y="378" text-anchor="middle" class="label-tiny">cluster state · vm health</text>
    <text x="700" y="394" text-anchor="middle" class="label-tiny">recent deploys (Harness)</text>
    <text x="700" y="410" text-anchor="middle" class="label-tiny">related alerts · prior incidents</text>
    <text x="700" y="426" text-anchor="middle" class="label-tiny">→ enrichment_context</text>
  </g>

  <g>
    <rect x="800" y="338" width="180" height="100" class="box box-pipeline" rx="6"/>
    <text x="890" y="358" text-anchor="middle" class="label" style="font-weight:700">4. Investigation agent</text>
    <text x="890" y="378" text-anchor="middle" class="label-tiny">OpenAI Agents SDK</text>
    <text x="890" y="394" text-anchor="middle" class="label-tiny">+ HolmesGPT (wrapped)</text>
    <text x="890" y="410" text-anchor="middle" class="label-tiny">task list · tool loop · cap tokens</text>
    <text x="890" y="426" text-anchor="middle" class="label-tiny">→ investigation, findings, tool_calls</text>
  </g>

  <g>
    <rect x="1000" y="338" width="160" height="100" class="box box-pipeline" rx="6"/>
    <text x="1080" y="358" text-anchor="middle" class="label" style="font-weight:700">5. Quality gate</text>
    <text x="1080" y="378" text-anchor="middle" class="label-tiny">groundedness check</text>
    <text x="1080" y="394" text-anchor="middle" class="label-tiny">redactor (regex + LLM)</text>
    <text x="1080" y="410" text-anchor="middle" class="label-tiny">approval if LOW conf</text>
    <text x="1080" y="426" text-anchor="middle" class="label-tiny">→ quality_verdict</text>
  </g>

  <g>
    <rect x="1180" y="338" width="160" height="100" class="box box-pipeline" rx="6"/>
    <text x="1260" y="358" text-anchor="middle" class="label" style="font-weight:700">6. Publish</text>
    <text x="1260" y="378" text-anchor="middle" class="label-tiny">Slack channel / DM</text>
    <text x="1260" y="394" text-anchor="middle" class="label-tiny">PagerDuty note</text>
    <text x="1260" y="410" text-anchor="middle" class="label-tiny">audit_log + replay_bundle</text>
    <text x="1260" y="426" text-anchor="middle" class="label-tiny">→ publish_record</text>
  </g>

  <!-- pipeline arrows -->
  <path class="arrow-thick" d="M 240 388 L 260 388" marker-end="url(#arrow)"/>
  <path class="arrow-thick" d="M 420 388 L 440 388" marker-end="url(#arrow)"/>
  <path class="arrow-thick" d="M 600 388 L 620 388" marker-end="url(#arrow)"/>
  <path class="arrow-thick" d="M 780 388 L 800 388" marker-end="url(#arrow)"/>
  <path class="arrow-thick" d="M 980 388 L 1000 388" marker-end="url(#arrow)"/>
  <path class="arrow-thick" d="M 1160 388 L 1180 388" marker-end="url(#arrow)"/>

  <!-- arrow from team profiles down to pipeline -->
  <path class="arrow" d="M 270 268 L 160 338" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 530 268 L 160 338" marker-end="url(#arrow)"/>
  <path class="arrow" d="M 790 268 L 160 338" marker-end="url(#arrow)"/>

  <!-- ============== Lane 4: Shared platform infra ============== -->
  <rect x="40" y="498" width="780" height="180" class="lane-bg" rx="4"/>
  <text x="60" y="520" class="lane">4. Firm-shared platform (D-13: reused, not built)</text>

  <rect x="80" y="538" width="160" height="60" class="box box-platform" rx="6"/>
  <text x="160" y="562" text-anchor="middle" class="label" style="font-weight:700">LiteLLM proxy</text>
  <text x="160" y="580" text-anchor="middle" class="label-tiny">on-prem vLLM only</text>

  <rect x="260" y="538" width="160" height="60" class="box box-platform" rx="6"/>
  <text x="340" y="562" text-anchor="middle" class="label" style="font-weight:700">vLLM cluster</text>
  <text x="340" y="580" text-anchor="middle" class="label-tiny">Llama / Qwen / DeepSeek</text>

  <rect x="440" y="538" width="160" height="60" class="box box-platform" rx="6"/>
  <text x="520" y="562" text-anchor="middle" class="label" style="font-weight:700">OTEL collector</text>
  <text x="520" y="580" text-anchor="middle" class="label-tiny">attribute filter + redact + route</text>

  <rect x="620" y="538" width="180" height="60" class="box box-platform" rx="6"/>
  <text x="710" y="562" text-anchor="middle" class="label" style="font-weight:700">Langfuse (self-host)</text>
  <text x="710" y="580" text-anchor="middle" class="label-tiny">project per team profile</text>

  <rect x="80" y="608" width="220" height="60" class="box box-data" rx="6"/>
  <text x="190" y="632" text-anchor="middle" class="label" style="font-weight:700">Shared Postgres cluster</text>
  <text x="190" y="650" text-anchor="middle" class="label-tiny">sentinel_app · sentinel_audit · pgvector</text>

  <rect x="320" y="608" width="220" height="60" class="box box-data" rx="6"/>
  <text x="430" y="632" text-anchor="middle" class="label" style="font-weight:700">S3 (KMS) — evidence</text>
  <text x="430" y="650" text-anchor="middle" class="label-tiny">tool outputs · raw payloads · 90d TTL</text>

  <rect x="560" y="608" width="240" height="60" class="box box-data" rx="6"/>
  <text x="680" y="632" text-anchor="middle" class="label" style="font-weight:700">audit_log → WORM archive</text>
  <text x="680" y="650" text-anchor="middle" class="label-tiny">7-year retention · object-lock</text>

  <!-- ============== Lane 5: Spoke clusters (target) ============== -->
  <rect x="840" y="498" width="520" height="180" class="lane-bg" rx="4"/>
  <text x="860" y="520" class="lane">5. Target spoke clusters (read-only, IRSA + assume-role)</text>

  <rect x="860" y="538" width="160" height="60" class="box box-spoke" rx="6"/>
  <text x="940" y="562" text-anchor="middle" class="label" style="font-weight:700">us-east prod</text>
  <text x="940" y="580" text-anchor="middle" class="label-tiny">ns: pm-a, pm-b, ...</text>

  <rect x="1040" y="538" width="160" height="60" class="box box-spoke" rx="6"/>
  <text x="1120" y="562" text-anchor="middle" class="label" style="font-weight:700">eu-west prod</text>
  <text x="1120" y="580" text-anchor="middle" class="label-tiny">ns: pm-c, pm-d, ...</text>

  <rect x="1220" y="538" width="120" height="60" class="box box-spoke" rx="6"/>
  <text x="1280" y="562" text-anchor="middle" class="label" style="font-weight:700">apac prod</text>
  <text x="1280" y="580" text-anchor="middle" class="label-tiny">ns: pm-e, ...</text>

  <rect x="860" y="608" width="240" height="60" class="box" rx="6" style="fill:#f5f5f5"/>
  <text x="980" y="632" text-anchor="middle" class="label" style="font-weight:700">Grafana · Prom · Loki · Tempo</text>
  <text x="980" y="650" text-anchor="middle" class="label-tiny">read-only via service tokens</text>

  <rect x="1120" y="608" width="220" height="60" class="box" rx="6" style="fill:#f5f5f5"/>
  <text x="1230" y="632" text-anchor="middle" class="label" style="font-weight:700">Jenkins · Harness API</text>
  <text x="1230" y="650" text-anchor="middle" class="label-tiny">read-only deploy/build queries</text>

  <!-- arrows pipeline → platform -->
  <path class="arrow-dim" d="M 890 438 L 160 538" marker-end="url(#arrow-dim)"/>
  <path class="arrow-dim" d="M 890 438 L 520 538" marker-end="url(#arrow-dim)"/>
  <text x="200" y="478" class="label-tiny">LLM via LiteLLM</text>
  <text x="540" y="478" class="label-tiny">spans via OTEL</text>

  <!-- arrows pipeline → spoke -->
  <path class="arrow-dim" d="M 890 438 L 940 538" marker-end="url(#arrow-dim)"/>
  <path class="arrow-dim" d="M 890 438 L 1120 538" marker-end="url(#arrow-dim)"/>
  <path class="arrow-dim" d="M 890 438 L 980 608" marker-end="url(#arrow-dim)"/>
  <path class="arrow-dim" d="M 890 438 L 1230 608" marker-end="url(#arrow-dim)"/>
  <text x="990" y="478" class="label-tiny">read-only tool calls</text>

  <!-- pipeline → DB -->
  <path class="arrow-dim" d="M 1260 438 L 190 608" marker-end="url(#arrow-dim)"/>

  <!-- ============== Lane 6: Outputs ============== -->
  <rect x="40" y="698" width="1320" height="80" class="lane-bg" rx="4"/>
  <text x="60" y="720" class="lane">6. Outputs (per-team channels; PM-redacted)</text>

  <rect x="160" y="730" width="220" height="38" class="box box-sre" rx="6"/>
  <text x="270" y="754" text-anchor="middle" class="label">#sre-oncall-&lt;team&gt;</text>

  <rect x="420" y="730" width="220" height="38" class="box box-devops" rx="6"/>
  <text x="530" y="754" text-anchor="middle" class="label">#devops-oncall</text>

  <rect x="680" y="730" width="220" height="38" class="box box-ace" rx="6"/>
  <text x="790" y="754" text-anchor="middle" class="label">PM Slack DM (ACE)</text>

  <rect x="940" y="730" width="220" height="38" class="box" rx="6" style="fill:#f0fdf4"/>
  <text x="1050" y="754" text-anchor="middle" class="label">PagerDuty incident note</text>

  <path class="arrow" d="M 1260 438 L 1260 720" marker-end="url(#arrow)"/>
  <path class="arrow-dim" d="M 1260 720 L 270 730" marker-end="url(#arrow-dim)"/>
  <path class="arrow-dim" d="M 1260 720 L 530 730" marker-end="url(#arrow-dim)"/>
  <path class="arrow-dim" d="M 1260 720 L 790 730" marker-end="url(#arrow-dim)"/>
  <path class="arrow-dim" d="M 1260 720 L 1050 730" marker-end="url(#arrow-dim)"/>

  <!-- ============== Five-layer barrier overlay ============== -->
  <text x="700" y="808" text-anchor="middle" class="lane">Five-layer cross-PM information barrier (defence-in-depth)</text>
  <g>
    <rect x="100" y="822" width="220" height="40" class="box" rx="6" style="fill:#fff5f5"/>
    <text x="210" y="840" text-anchor="middle" class="label-small" style="font-weight:700">1. K8s RBAC</text>
    <text x="210" y="855" text-anchor="middle" class="label-tiny">namespace-scoped roles</text>

    <rect x="340" y="822" width="220" height="40" class="box" rx="6" style="fill:#fff5f5"/>
    <text x="450" y="840" text-anchor="middle" class="label-small" style="font-weight:700">2. App tenant scoping</text>
    <text x="450" y="855" text-anchor="middle" class="label-tiny">harness rejects cross-PM args</text>

    <rect x="580" y="822" width="220" height="40" class="box" rx="6" style="fill:#fff5f5"/>
    <text x="690" y="840" text-anchor="middle" class="label-small" style="font-weight:700">3. LiteLLM tenant routing</text>
    <text x="690" y="855" text-anchor="middle" class="label-tiny">virtual key + model allowlist</text>

    <rect x="820" y="822" width="220" height="40" class="box" rx="6" style="fill:#fff5f5"/>
    <text x="930" y="840" text-anchor="middle" class="label-small" style="font-weight:700">4. Output redactor</text>
    <text x="930" y="855" text-anchor="middle" class="label-tiny">regex + LLM judge</text>

    <rect x="1060" y="822" width="220" height="40" class="box" rx="6" style="fill:#fff5f5"/>
    <text x="1170" y="840" text-anchor="middle" class="label-small" style="font-weight:700">5. Trace store RLS</text>
    <text x="1170" y="855" text-anchor="middle" class="label-tiny">per-tenant Postgres policy</text>
  </g>
  <path class="barrier" d="M 90 818 L 1290 818 L 1290 875 L 90 875 Z"/>
</svg>
