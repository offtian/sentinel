apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  labels:
    app.kubernetes.io/name: order-processor
    app.kubernetes.io/instance: order-processor
    app.kubernetes.io/version: 1.0.0
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: order-processor
    app.kubernetes.io/managed-by: helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: order-processor
      app.kubernetes.io/instance: order-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-processor
        app.kubernetes.io/instance: order-processor
        app.kubernetes.io/version: 1.0.0
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: order-processor
        app.kubernetes.io/managed-by: helm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
      containers:
        - name: order-processor
          image: order-processor:1.0.0
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
