apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-processor
  labels:
    app.kubernetes.io/name: order-processor
    app.kubernetes.io/instance: order-processor
    team: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: order-processor
      app.kubernetes.io/instance: order-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-processor
        app.kubernetes.io/instance: order-processor
        team: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: order-processor
        image: order-processor:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
