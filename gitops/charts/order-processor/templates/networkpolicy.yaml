apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-processor
  labels:
    app.kubernetes.io/name: order-processor
    app.kubernetes.io/instance: order-processor
    team: backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-processor
      app.kubernetes.io/instance: order-processor
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          team: frontend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          team: database
    ports:
    - protocol: TCP
      port: 5432
