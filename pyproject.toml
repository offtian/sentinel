# Packaging
# ---------

[build-system]
requires = ["setuptools>=67.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"sentinel" = [
    "**/*.md",
    "**/alembic.ini",
    "**/*.j2",
]

# Project
# -------

[project]
name = "sentinel"
requires-python = ">=3.13"
dynamic = ["version"]

dependencies = [
    # Core application
    "environs",
    "pydantic-settings>=2.0",
    "fastapi[standard]",
    "sqlalchemy[asyncio]",
    "sqlmodel",
    "asyncpg",
    "databases[asyncpg]",
    "psycopg2-binary",
    "alembic",
    "pydantic-ai>=1.0.7",
    "litellm>=1.60",
    "structlog",
    "Jinja2",
    "aiofiles",
    "tenacity",
    "invoke",
    "attrs",
    "PyYAML",
    "fastmcp>=2.0",
    # Vendors
    "pdpyras",
    "datadog-api-client",
    "jira",
    "atlassian-python-api",
    "boto3",
    "slack_bolt",
    "kubernetes-asyncio>=31.0",
    # Observability
    "ddtrace",
    "sentry-sdk>=2.35",
    "tiktoken>=0.12.0",
    "streamlit>=1.39",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-prometheus>=0.48b0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-system-metrics>=0.48b0",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "logfire",
    "prometheus-client>=0.21",
    "langgraph>=1.1.9",
    "langgraph-checkpoint-postgres>=3.0.3,<4",
    "langfuse>=4.5.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest",
    "pytest-env",
    "pytest-asyncio",
    "pytest-postgresql",
    "pytest-mock",
    "pytest-xdist>=3.8.0",
    "factory-boy",
    "pydantic-evals",

    # Linting
    "import-linter",
    "mypy",
    "types-aiofiles",
    "types-PyYAML",
    "ruff",

    # Localdev
    "pre-commit",
    "ipdb",
]

# HolmesGPT SDK — installed from fork with httpx/postgrest compatibility fixes.
# Upstream (robusta-dev/holmesgpt) pins httpx<0.28 and postgrest==0.16.8 which
# conflict with pydantic-ai>=1.0.7. Our fork (offtian/holmesgpt@httpx-compat)
# relaxes these pins. Track upstream for when they merge similar changes.
holmes = ["holmesgpt @ git+https://github.com/offtian/holmesgpt.git@httpx-compat"]

[tool.setuptools.dynamic]
version = {attr = "sentinel.version.__version__"}

# Ruff
# ----

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["ALL"]
exclude = ["build", "migrations", "tests", "*.ipynb"]
ignore = [
    "A005",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN204",
    "ANN401",
    "ARG",
    "BLE001",
    "COM812",
    "D1",
    "D200",
    "D203",
    "D205",
    "D212",
    "D301",
    "D400",
    "D401",
    "D406",
    "D407",
    "D408",
    "D413",
    "D415",
    "E501",
    "EM",
    "ERA001",
    "FIX",
    "N818",
    "PERF401",
    "PLC0414",
    "PLC0415",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR2004",
    "PLR5501",
    "PLR6301",
    "PTH123",
    "PYI041",
    "RUF001",
    "S101",
    "S104",
    "S311",
    "SIM102",
    "SIM108",
    "SIM300",
    "SIM910",
    "TC001",
    "TC002",
    "TC003",
    "TD002",
    "TD003",
    "TID252",
    "TRY003",
    "TRY300",
    "W505",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/migrations/**" = ["ANN", "I001"]
"tests/**" = ["ANN", "D205", "D213", "SLF001"]
"tests/factories/**" = ["RUF012", "D417"]
"tasks/**" = ["T201"]

[tool.ruff.lint.isort]
lines-after-imports = 2
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "project",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"project" = ["sentinel", "tests"]

[tool.ruff.lint.flake8-builtins]
strict-checking = true

# Import linter
# -------------

[tool.importlinter]
root_package = "sentinel"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Top level layers"
type = "layers"
exhaustive = true
containers = ["sentinel"]
layers = [
    "main",
    "worker",
    "replay",
    "plugins",
    "interfaces",
    "application",
    "evals",
    "domain",
    "vendors",
    "bootstrap",
    "bootstrap_otel",
    "utils",
    "config",
    "data",
    "settings",
    "version",
]
# F4.7: ExecutionTracer (domain) drives the replay-bundle capture lifecycle —
# bind/flush/record helpers live in plugins.toolsets._runtime alongside the
# ReplayCapturingToolset that uses them. The helpers themselves have no
# pydantic-ai dependency and could be lifted into utils/, but doing so would
# duplicate the ContextVar across layers. Allowed pending a follow-up that
# moves the harness-only helpers down into utils/replay_runtime.py.
ignore_imports = [
    "sentinel.domain.pipeline.tracer -> sentinel.plugins.toolsets._runtime",
]

[[tool.importlinter.contracts]]
name = "Stdlib logging forbidden"
type = "forbidden"
source_modules = ["sentinel"]
forbidden_modules = ["logging"]
ignore_imports = [
    "sentinel.utils.logs -> logging",
    "sentinel.data.migrations.alembic.env -> logging",
]

[[tool.importlinter.contracts]]
name = "Vendor adapters should not be imported in domain operations"
type = "forbidden"
source_modules = ["sentinel.domain.**.operations"]
forbidden_modules = ["sentinel.domain.vendor_adapters"]

# Mypy
# ----

[tool.mypy]
files = "."
exclude = ["build", "migrations", "tests"]
plugins = []

strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
module = ["invoke"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[[tool.mypy.overrides]]
module = ["aioboto3", "holmesgpt.*", "holmes.*", "litellm", "litellm.*", "pdpyras", "jira.*", "atlassian.*"]
ignore_missing_imports = true

# Pytest
# ------

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: marks tests that exercise expensive paths (e.g. F4.8 30-run determinism); kept on by default in test-integration",
]

env = [
    "PYTHONBREAKPOINT=ipdb.set_trace",
    "DATABASE_URL=postgresql+asyncpg://postgres@localhost/sentinel-test",
    "OLLAMA_BASE_URL=http://localhost:11434",
    "INTENT_ROUTER_LLM=openai/gpt-test",
    "ALERT_CLASSIFIER_LLM=openai/gpt-test",
    "ROOT_CAUSE_LLM=openai/gpt-test",
    "TICKET_REVIEWER_LLM=openai/gpt-test",
    "RESPONSE_DRAFTER_LLM=openai/gpt-test",
    "PAGERDUTY_API_KEY=test-pd-key",
    "DATADOG_API_KEY=test-dd-key",
    "DATADOG_APP_KEY=test-dd-app-key",
    "JIRA_BASE_URL=https://test.atlassian.net",
    "JIRA_API_TOKEN=test-jira-token",
    "JIRA_USER_EMAIL=test@example.com",
    "CONFLUENCE_BASE_URL=https://test.atlassian.net/wiki",
    "SLACK_BOT_TOKEN=xoxb-test",
    "SRE_SLACK_CHANNEL=C12345678",
    "SUPPORT_SLACK_CHANNEL=C87654321",
]

python_files = "test_*.py"
testpaths = "tests"

filterwarnings = [
    "error",
    "ignore::DeprecationWarning:environs",
    "error::ResourceWarning",
    "error::RuntimeWarning",
    "error::DeprecationWarning",
    "ignore:.*asyncio.iscoroutinefunction.*:DeprecationWarning",
    "error::pytest.PytestCollectionWarning",
    # langchain-core pulls in pydantic.v1 which warns on Python 3.14+. The
    # warning surfaces when importing langgraph-checkpoint-postgres; nothing
    # in our code uses pydantic.v1 directly. Track upstream for compat.
    "ignore:.*Pydantic V1 functionality isn't compatible.*:UserWarning",
]
