prescribed_checks:
  - id: establish_scope
    description: Identify what is broken, where, since when, and who is affected
    suggested_tools: [k8s_describe_pod, k8s_describe_deployment]
    required: false
  - id: reconstruct_timeline
    description: Pull recent deploys, config changes, and preceding alerts in the half-hour window
    suggested_tools: [harness_recent_deploys, k8s_get_events]
    required: false
  - id: check_saturation
    description: Inspect CPU, memory, disk, network, and queue depth versus limits
    suggested_tools: [prom_query_range, prom_query_instant]
    required: false
  - id: scan_errors
    description: Sample recent log lines and compare error-rate to historical baseline
    suggested_tools: [k8s_get_pod_logs, datadog_get_logs]
    required: false
  - id: walk_dependencies
    description: Check health and error-rate of upstream synchronous dependencies
    suggested_tools: [prom_query_range, datadog_get_logs]
    required: false
  - id: form_hypothesis
    description: State a single falsifiable hypothesis with one read-only check that would distinguish it
    suggested_tools: []
    required: false

groundedness_rules:
  - rule_id: every_finding_has_evidence
    description: Every Finding MUST cite at least one evidence_ref pointing at a recorded tool_call
  - rule_id: evidence_within_investigation
    description: Every evidence_ref must match a tool_call.evidence_object_id within the same investigation

body_sanitization:
  reject_auto_rendered_urls: true
  allowed_url_locations:
    - canonical_sources
    - frontmatter
