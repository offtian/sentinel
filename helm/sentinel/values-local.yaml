# Local development overrides for Docker Desktop Kubernetes.

image:
  repository: sentinel-api
  tag: local
  pullPolicy: Never  # Image loaded directly into containerd

deployments:
  api:
    enabled: true
    replicaCount: 1
    command: [".venv/bin/uvicorn", "sentinel.interfaces.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false

  worker:
    enabled: true
    replicaCount: 1
    command: [".venv/bin/python", "-m", "sentinel.worker"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false

  chat:
    enabled: true
    replicaCount: 1
    port: 8501
    command: [".venv/bin/streamlit", "run", "src/sentinel/interfaces/chat/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: false
    livenessProbe:
      httpGet:
        path: /_stcore/health
        port: 8501
      initialDelaySeconds: 10
    readinessProbe:
      httpGet:
        path: /_stcore/health
        port: 8501
      initialDelaySeconds: 5

# Disable security constraints that block local development
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false  # Allow uv to write to .venv cache
  capabilities:
    drop:
      - ALL

# Run migrations before deploy
migration:
  enabled: true
  command: [".venv/bin/python", "-m", "alembic", "-c", "src/sentinel/data/alembic.ini", "upgrade", "head"]

# Expose API via NodePort for localhost access
service:
  type: NodePort
  port: 8000

# Environment variables for local development
env:
  ENVIRONMENT: localdev
  DATABASE_URL: "postgresql+asyncpg://postgres:postgres@sentinel-postgres:5432/sentinel"
  AI_GATEWAY_URL: "http://ollama:11434"
  # LLM models routed through Ollama (override to match your pulled models)
  INTENT_ROUTER_LLM: "ollama/qwen3:8b"
  ALERT_CLASSIFIER_LLM: "ollama/qwen3:8b"
  ROOT_CAUSE_LLM: "ollama/qwen3:8b"
  TICKET_REVIEWER_LLM: "ollama/qwen3:8b"
  RESPONSE_DRAFTER_LLM: "ollama/qwen3:8b"
  SRE_AUTO_INVESTIGATE: "true"
  SUPPORT_AUTO_DRAFT: "true"
  # Grafana stack (auto-selected when ENVIRONMENT=localdev, deployed via helm/grafana-stack-local.yaml)
  GRAFANA_URL: "http://grafana:3000"
  GRAFANA_PROMETHEUS_DATASOURCE_UID: prometheus
  GRAFANA_LOKI_DATASOURCE_UID: loki
  GRAFANA_TEMPO_DATASOURCE_UID: tempo
