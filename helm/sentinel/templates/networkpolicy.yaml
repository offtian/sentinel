{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sentinel.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from ingress controller to API pods
    - from:
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Allow PostgreSQL
    - to:
        {{- with .Values.networkPolicy.databaseCIDR }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - port: 5432
          protocol: TCP
    # Allow Grafana stack (when OBSERVABILITY_BACKEND=grafana)
    {{- with .Values.networkPolicy.grafanaNamespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
      ports:
        - port: 3000
          protocol: TCP
    {{- end }}
    # Allow external vendor APIs (PagerDuty, Jira, Datadog, Slack) over HTTPS
    - to: []
      ports:
        - port: 443
          protocol: TCP
    # Allow K8s API server (for K8s investigation agent)
    {{- if .Values.k8sAgent.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.k8sAgent.apiServerCIDR | default "0.0.0.0/0" }}
      ports:
        - port: 6443
          protocol: TCP
    {{- end }}
    # Allow kagent namespace
    {{- if .Values.kagent.enabled }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.kagent.namespace }}
    {{- end }}
    # Allow MCP server (internal)
    {{- if .Values.mcpServer.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: mcp-server
      ports:
        - port: {{ .Values.mcpServer.port }}
          protocol: TCP
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
