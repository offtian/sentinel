# Local PostgreSQL for Kubernetes development.
# Not for production — use a managed database service instead.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sentinel-postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-postgres
  labels:
    app: sentinel-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-postgres
  template:
    metadata:
      labels:
        app: sentinel-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sentinel
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: sentinel-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-postgres
spec:
  selector:
    app: sentinel-postgres
  ports:
    - port: 5432
      targetPort: 5432
